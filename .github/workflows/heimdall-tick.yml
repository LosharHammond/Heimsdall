# Runs Heimdall's scheduled jobs on Vercel every 30 minutes: alert and push retries, the "device went quiet" check and daily cleanup.
# Alerts themselves go out straight away; this only catches what a busy moment missed.
# Repository settings > Secrets and variables > Actions:
#   secret   HEIMDALL_CRON_SECRET  the same value as CRON_SECRET in Vercel
#   variable HEIMDALL_URL          e.g. https://kenuxa-heimdall.vercel.app
# Every 30 minutes uses about 1,500 of a private repository's 2,000 free minutes a month; public repositories are free.
name: Heimdall scheduled jobs
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduled jobs
        env:
          URL: ${{ vars.HEIMDALL_URL }}
          SECRET: ${{ secrets.HEIMDALL_CRON_SECRET }}
        run: |
          test -n "$URL" && test -n "$SECRET" || { echo "Set HEIMDALL_URL (variable) and HEIMDALL_CRON_SECRET (secret) first."; exit 1; }
          curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $SECRET" "$URL/api/cron/tick"
