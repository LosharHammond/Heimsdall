<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:320px;font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif;color:#1C2033}
header{display:flex;gap:10px;align-items:center;padding:14px 16px;background:#1F2547;color:#fff}
header b{display:block}header small{color:#C9CDE6}
main{padding:14px 16px}.st{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#3E7A5E;box-shadow:0 0 0 4px #E1EEE7}.dot.off{background:#E0B23D;box-shadow:0 0 0 4px #F8EDCC}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.nums div{background:#F5F6FA;border-radius:10px;padding:8px;text-align:center}
.nums b{display:block;font-size:20px}.nums span{font-size:11.5px;color:#5D6480}
a.btn,button{display:block;width:100%;box-sizing:border-box;text-align:center;height:38px;line-height:38px;border-radius:10px;border:0;background:#E0B23D;color:#1F2547;font:700 14px inherit;text-decoration:none;cursor:pointer;margin-top:8px}
button.ghost{background:#fff;border:1px solid #D4D7E3;line-height:36px;font-weight:600}
p{margin:6px 0;color:#5D6480;font-size:12.5px}
</style></head><body>
<header><svg width="26" height="26" viewBox="0 0 24 24" fill="#E0B23D"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/></svg><div><b>Heimdall browser guard</b><small id="ver"></small></div></header>
<main><div class="st"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>
<p id="who"></p>
<div class="nums"><div><b id="n1">0</b><span>checked today</span></div><div><b id="n2">0</b><span>blocked today</span></div><div><b id="n3">0</b><span>sent for approval</span></div></div>
<p>Guards ChatGPT, Claude, Gemini, Copilot, Perplexity, DeepSeek, Grok, Mistral, Meta AI and Poe. Text never leaves your browser: Heimdall only learns what kind of secret was found.</p>
<a class="btn" id="open" target="_blank">Open Heimdall</a><button class="ghost" id="off" hidden>Unlink this browser</button></main>
<script src="popup.js"></script></body></html>
