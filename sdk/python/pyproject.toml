[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenuxa-heimdall"
version = "0.1.0"
description = "Permission firewall for AI agents: allow, deny or ask a person before a tool runs, and prove what ran."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=41"]
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.2"]
all = ["cryptography>=41", "langchain-core>=0.3", "openai-agents>=0.2"]
test = ["pytest>=8", "cryptography>=41", "langchain-core>=0.3", "openai-agents>=0.2"]

[tool.setuptools.packages.find]
include = ["heimdall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
